# Required repository secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — Arvan storage credentials
#   MAIN_S3_BUCKET                            — Arvan bucket that serves the app
# Optional repository variable:
#   S3_ENDPOINT                               — defaults to Arvan ir-central1

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: "default"
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT || 'https://s3.ir-central1.arvanstorage.ir' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  sync_main:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync dist to S3
        env:
          S3_BUCKET: ${{ secrets.MAIN_S3_BUCKET }}
        run: |
          set -euo pipefail

          if [ -z "${S3_BUCKET:-}" ]; then
            echo "MAIN_S3_BUCKET secret is not set"
            exit 1
          fi

          echo "Syncing dist/ → s3://${S3_BUCKET}"
          aws s3 sync dist/ "s3://${S3_BUCKET}" \
            --endpoint-url "${S3_ENDPOINT}" \
            --exact-timestamps \
            --no-progress \
            --delete
